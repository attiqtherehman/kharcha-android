name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kharcha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # Signed release for version tags (v1.0.0, v1.1.0-beta1, ...). Needs four repository secrets named
  # like the environment variables app/build.gradle.kts reads: KHARCHA_KEYSTORE (base64 of the
  # keystore file), KHARCHA_KEYSTORE_PASSWORD, KHARCHA_KEY_ALIAS and KHARCHA_KEY_PASSWORD.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write the keystore from the KHARCHA_KEYSTORE secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KHARCHA_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KHARCHA_KEYSTORE is not set (base64 of the release keystore)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kharcha-release.jks"

      - name: Assemble signed release APK
        env:
          KHARCHA_KEYSTORE: ${{ runner.temp }}/kharcha-release.jks
          KHARCHA_KEYSTORE_PASSWORD: ${{ secrets.KHARCHA_KEYSTORE_PASSWORD }}
          KHARCHA_KEY_ALIAS: ${{ secrets.KHARCHA_KEY_ALIAS }}
          KHARCHA_KEY_PASSWORD: ${{ secrets.KHARCHA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the signature and collect the release files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found; are all four KHARCHA_* secrets set?"
            ls -l app/build/outputs/apk/release || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/kharcha-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/kharcha-${GITHUB_REF_NAME}-mapping.txt"
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
              --title "Kharcha $GITHUB_REF_NAME" "${PRERELEASE[@]}"
          fi
